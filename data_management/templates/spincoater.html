<!doctype html>
<html>
{% extends "base.html" %}
{% block content %}
<head>
    <meta charset="utf-8">
    <title>Spincoater Control</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/data_management.css' %}">
</head>
<body>
    <h2>Spincoater Control</h2>
    <form action="{% url 'spincoater' %}" method="POST">
        {% csrf_token %}
        <label for="rpm">Enter RPM:</label>
        <input type="number" id="rpm" name="rpm" min="0" required>
        <br><br>
        <label for="time">Enter Time (in seconds):</label>
        <input type="number" id="time" name="time" min="0" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
{% endblock %}
